<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- App Icon Background rounded rect for iOS -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="107" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3"/>
  <circle cx="256" cy="200" r="160" fill="url(#glowGrad)"/>
  
  <!-- Crossed Hammer & Wrench Icon Motif -->
  <g transform="translate(120, 100) scale(1.1)">
    <!-- Shield / Badge Backing -->
    <path d="M124 10 L230 48 C230 160 170 230 124 250 C78 230 18 160 18 48 Z" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="6"/>
    
    <!-- Stylized Hammer -->
    <path d="M70 180 L140 110 L160 130 L90 200 Z" fill="#e4e4e7"/>
    <path d="M130 90 L170 50 L195 75 L155 115 Z" fill="url(#amberGrad)"/>
    <rect x="125" y="45" width="25" height="15" rx="3" fill="#fbbf24"/>
    
    <!-- Spark / Flash Star -->
    <polygon points="190,40 197,55 212,60 197,65 190,80 183,65 168,60 183,55" fill="#fef08a"/>
  </g>
  
  <!-- Text Label "HOT SPOT" -->
  <text x="256" y="415" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="3">HOT SPOT</text>
  <text x="256" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#f59e0b" letter-spacing="6">WORKSHOP</text>
</svg>
