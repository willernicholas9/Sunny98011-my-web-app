    <!-- Universal Error Guard for iframe preview -->
    <script>
      (function() {
        function shouldIgnore(msg, file) {
          var m = String(msg || '');
          var f = String(file || '');
          return m.indexOf('WebSocket') !== -1 || m.indexOf('vite') !== -1 || f.indexOf('@vite/client') !== -1 || f.indexOf('vite-hmr') !== -1;
        }
        window.addEventListener('error', function(e) {
          if (e && (shouldIgnore(e.message, e.filename) || shouldIgnore(e.error && e.error.message, ''))) {
            e.preventDefault && e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e ? (e.reason && (e.reason.message || String(e.reason))) : '';
          if (shouldIgnore(reason, '')) {
            e.preventDefault && e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
